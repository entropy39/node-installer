### Entropy39 Node — Debian 13 preseed
###
### Language, country, keyboard, passwords and disk partitioning deliberately
### remain interactive.

# Network configuration remains interactive if automatic configuration fails.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string entropy39
d-i netcfg/get_hostname seen false
d-i netcfg/get_domain string

# Ask Debian Installer to create the normal user, with editable full-name and
# username defaults. Password questions are intentionally not preseeded.
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Entropy39 Node
d-i passwd/user-fullname seen false
d-i passwd/username string nodesmith
d-i passwd/username seen false

# Use authenticated Debian repositories and current updates.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/use_mirror boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/cdrom/set-first boolean false

# Headless standard system with SSH, Apache and component-installer dependencies.
tasksel tasksel/first multiselect standard, ssh-server, web-server
d-i pkgsel/include string apache2 openssh-server ca-certificates curl git gnupg php libapache2-mod-php php-curl python3
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

# Keep partitioning interactive while defaulting the method to guided use of
# an entire disk. Debian still asks which disk to use and requires its normal
# data-loss confirmations.
d-i partman-auto/init_automatically_partition select some_device
d-i partman-auto/init_automatically_partition seen false

# Register the installed Debian boot loader in UEFI NVRAM. Debian's standard
# grub-installer handles the architecture-specific details.
d-i grub-installer/update-nvram boolean true

# Install only the first-boot bootstrap from the ISO. It retrieves one complete
# node-installer Git commit after the installed system boots.
d-i preseed/late_command string \
    cp -r /cdrom/entropy39/firstboot /target/root/firstboot; \
    in-target /bin/bash /root/firstboot/install-firstboot.sh; \
    rm -rf /target/root/firstboot; \
    mkdir -p /target/etc/default/grub.d; \
    printf 'GRUB_TIMEOUT_STYLE=hidden\nGRUB_TIMEOUT=2\n' > /target/etc/default/grub.d/entropy39-node.cfg; \
    in-target update-grub; \
    debconf-loadtemplate finish-install /cdrom/entropy39/finish-install.templates
